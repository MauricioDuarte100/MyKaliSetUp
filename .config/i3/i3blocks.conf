# ==============================================================================
# I3BLOCKS CONFIGURATION - KALI CYBER ENVIRONMENT
# ==============================================================================

command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=20
separator=true
markup=none

# Target IP (Pentesting / HackTheBox / TryHackMe)
[target]
command=~/.config/i3/scripts/target_status.sh
label=Target: 
interval=3

# VPN IP (tun0 / wg0)
[vpn]
command=~/.config/i3/scripts/vpn_status.sh
label=VPN: 
interval=5

# CPU usage
[cpu_usage]
label=CPU: 
interval=5
min_width=CPU 100.00%

# Memory usage
[memory]
label=RAM: 
interval=10

# Disk usage
[disk]
label=Disk: 
interval=120

# Date & Time
[time]
command=date '+%a %d %b %Y %H:%M:%S'
interval=1
