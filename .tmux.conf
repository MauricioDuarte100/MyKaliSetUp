# ==============================================================================
# 🛡️ TMUX CONFIGURATION - CYBER & PENTESTING ENVIRONMENT (xct Inspired)
# ==============================================================================

# Soporte de 256 colores y TrueColor
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Habilitar soporte de ratón (selección, cambio de paneles, scroll)
set -g mouse on

# Aumentar historial para no perder salidas largas de nmap, gobuster, etc.
set -g history-limit 50000

# Reducir delay de la tecla Escape (esencial para Vim/Neovim)
set -s escape-time 0

# Numeración de ventanas y paneles comenzando en 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Atajos de División de Paneles más intuitivos
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Recargar configuración rápidamente con Prefix + r
bind r source-file ~/.tmux.conf \; display-message " Configuración de Tmux recargada!"

# Navegación entre paneles estilo Vim (Alt + h/j/k/l sin necesidad de prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Redimensionar paneles (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Modo Copia estilo Vi con integración al portapapeles de X11 (xclip)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Sincronización de paneles (Prefix + y) para enviar comandos a todos los paneles simultáneamente
bind y setw synchronize-panes \; display-message " Sincronización de paneles alternada!"

# ==============================================================================
# BARRA DE ESTADO (STATUS BAR) - DARK CYBER STYLE
# ==============================================================================
set -g status on
set -g status-interval 3
set -g status-position bottom
set -g status-justify left

# Colores de la barra
set -g status-style bg="#0f141c",fg="#e6edf3"

# Estilo de paneles
set -g pane-border-style fg="#1e222a"
set -g pane-active-border-style fg="#58a6ff"

# Lado Izquierdo: Sesión
set -g status-left "#[bg=#1f6feb,fg=#ffffff,bold] #S #[bg=#0f141c] "
set -g status-left-length 30

# Lado Derecho: VPN y Target IP en tiempo real
set -g status-right-length 100
set -g status-right "#[fg=#7ee787,bg=#161b22] #(ip -4 addr show tun0 2>/dev/null | grep -oP '(?<=inet\\s)\\d+(\\.\\d+){3}' || echo 'No VPN') #[fg=#ff7b72,bg=#0f141c] 🎯 #(cat ~/.config/i3/target 2>/dev/null || echo 'No Target') #[fg=#8b949e,bg=#161b22] %H:%M %d-%b "

# Formato de Ventanas
setw -g window-status-format "#[fg=#8b949e,bg=#0f141c] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#1f242c,bold] #I:#W* #[bg=#0f141c]"
