# ==============================================================================
# TMUX CONFIGURATION - CYBER & PENTESTING ENVIRONMENT (xct Inspired)
# ==============================================================================

# Enable 256 colors and TrueColor
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support (selection, pane switching, scroll)
set -g mouse on

# Increase history limit for large scan outputs (nmap, gobuster, etc.)
set -g history-limit 50000

# Remove escape key delay for Vim/Neovim
set -s escape-time 0

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive pane splitting shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick configuration reload with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Navigate panes using Vim keys (Alt + h/j/k/l without prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy mode with X11 clipboard integration (xclip)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Synchronize panes toggle (Prefix + y)
bind y setw synchronize-panes \; display-message "Pane synchronization toggled!"

# ==============================================================================
# STATUS BAR - DARK CYBER STYLE
# ==============================================================================
set -g status on
set -g status-interval 3
set -g status-position bottom
set -g status-justify left

# Bar colors
set -g status-style bg="#0f141c",fg="#e6edf3"

# Pane border styling
set -g pane-border-style fg="#1e222a"
set -g pane-active-border-style fg="#58a6ff"

# Left side: Session name
set -g status-left "#[bg=#1f6feb,fg=#ffffff,bold] #S #[bg=#0f141c] "
set -g status-left-length 30

# Right side: VPN IP and Target IP
set -g status-right-length 100
set -g status-right "#[fg=#7ee787,bg=#161b22] VPN: #(ip -4 addr show tun0 2>/dev/null | grep -oP '(?<=inet\\s)\\d+(\\.\\d+){3}' || echo 'None') #[fg=#ff7b72,bg=#0f141c] TGT: #(cat ~/.config/i3/target 2>/dev/null || echo 'None') #[fg=#8b949e,bg=#161b22] %H:%M %d-%b "

# Window format
setw -g window-status-format "#[fg=#8b949e,bg=#0f141c] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#1f242c,bold] #I:#W* #[bg=#0f141c]"
